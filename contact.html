<script>
document.getElementById('form-contact').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, bouton = f.querySelector('button'), libelle = bouton.querySelector('.ruban'), msg = document.getElementById('msg-contact');
  var d = I18N[lang];
  bouton.disabled = true; libelle.textContent = d.coAttente; msg.className = 'retour'; msg.textContent = '';
  function echec() { bouton.disabled = false; libelle.textContent = I18N[lang].coEnvoyer; msg.className = 'retour ko'; msg.textContent = I18N[lang].coKo; }
  fetch('https://app.lachouettecosy.com/api/contact', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nom: document.getElementById('c-nom').value, email: document.getElementById('c-email').value, sujet: document.getElementById('c-sujet').value,
      message: document.getElementById('c-message').value, siteWeb: document.getElementById('champ-piege').value, rendu: RENDU_PAGE })
  }).then(function (r) {
    if (r.ok) { f.style.display = 'none'; msg.className = 'retour ok'; msg.textContent = I18N[lang].coOk; } else echec();
  }).catch(echec);
});
</script>
